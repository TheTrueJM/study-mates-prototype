<!DOCTYPE html>
<html>
  <head>
    <title>Study Mates - Tutorial</title>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" integrity="sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+" crossorigin="anonymous"></script>
  </head>
  
  <body>
    <h1 id="title">Tutorial</h1>
    <h3>State: <span id="state">lobby</span></h3>

    <!-- Display if State == lobby -->
    <div id="lobby">
      <button id="group-start-btn">Start Grouping</button>
      <h2>Students</h2>
      <ul id="students">
        <!-- Student1 -->
        <!-- Student2 -->
        <!-- ... -->
      </ul>
    </div>

    <!-- Display if State == groups -->
    <div id="groups">
      <button id="discussion-start-btn">Start Discussion</button>
      <button id="group-remake-btn">Remake Grouping</button>
      <button id="lobby-reset-g-btn">Back to Lobby</button>
      <h2>Groups</h2>
      <div id="group_list">
        <!-- Group1: Student1, Student2, ... -->
        <!-- Group2: Student1, Student2, ... -->
        <!-- ... -->
      </div>
    </div>

    <!-- Display if State == discussion -->
    <div id="discussion">
      <button id="discussion-end-btn">End Discussion</button> <!-- Ends Discussion Timer -->
      <button id="group-next-btn">Next Grouping</button>
      <button id="lobby-reset-d-btn">Back to Lobby</button>
      <h2>Discussion Questions</h2>
      <ul id="questions">
        <!-- Question1 -->
        <!-- Question2 -->
        <!-- ... -->
      </ul>
    </div>


    <script>
      let uuid = localStorage.getItem("uuid");

      const socket = io("ws://127.0.0.1:5000/staff", {auth: { uuid: uuid }});

      socket.on("session", data => {
        uuid = data.uuid;
        localStorage.setItem("uuid", uuid);
      });


      socket.on("tutorial_update", tutorial => {
        console.log(tutorial)
        const code = window.location.pathname.split('/').pop();
        document.getElementById("title").innerText = `${tutorial.name} - ${code}`;
        document.getElementById("state").innerText = tutorial.state;

        document.getElementById("lobby").style.display = tutorial.state === "lobby" ? "block" : "none";
        document.getElementById("groups").style.display = tutorial.state === "groups" ? "block" : "none";
        document.getElementById("discussion").style.display = tutorial.state === "discussion" ? "block" : "none";

        const studentsEl = document.getElementById("students");
        studentsEl.innerHTML = "";
        Object.entries(tutorial.students).forEach(([id, student]) => {
          const li = document.createElement("li");
          li.innerText = student.name;
          studentsEl.appendChild(li);
        });

        const groupListEl = document.getElementById("group_list");
        groupListEl.innerHTML = "";
        Object.entries(tutorial.groups).forEach(([num, group]) => {
          const groupDiv = document.createElement("div");

          // Group Number
          const number = document.createElement("strong");
          number.innerText = `Group ${num}`;
          groupDiv.appendChild(number);

          // Group Members
          const ul = document.createElement("ul");
          group.forEach(member => {
            const li = document.createElement("li");
            li.innerText = tutorial.students[member].name;
            ul.appendChild(li);
          });

          groupDiv.appendChild(ul);
          groupListEl.appendChild(groupDiv);
        });

        const questionsEl = document.getElementById("questions");
        questionsEl.innerHTML = "";
        tutorial.questions.forEach(question => {
            const p = document.createElement("p");
            p.innerText = question;
            questionsEl.appendChild(p);
        });
    });


    document.getElementById("group-start-btn").onclick = () => {
      socket.emit("start_grouping");
    };
    document.getElementById("group-remake-btn").onclick = () => {
      socket.emit("start_grouping");
    };
    document.getElementById("group-next-btn").onclick = () => {
      socket.emit("start_grouping");
    };


    document.getElementById("discussion-start-btn").onclick = () => {
      socket.emit("start_discussion");
    };

    
    document.getElementById("lobby-reset-g-btn").onclick = () => {
      socket.emit("reset_lobby");
    };
    document.getElementById("lobby-reset-d-btn").onclick = () => {
      socket.emit("reset_lobby");
    };
    </script>
  </body>
</html>
