<!DOCTYPE html>
<html>
    <head>
        <title>Studty Mates - Your Details</title>
    </head>

    <body>
        <h1>Your Details</h1>

        <form method="POST">
            <label>
                Current GPA:
                <input type="number" name="currentGPA" step="0.1" value="4.0" required/>
            </label>
            <br><br>

            <label>
                Goal GPA:
                <input type="number" name="goalGPA" step="0.1" value="4.0"/>
            </label>
            <br><br>
        
            <!-- Update to Selection Type for Days and Times - Requires JS Functionality -->
            <label>
                Availability:
                <input type="text" name="availability"/>
            </label>
            <br><br>

            <button type="submit">Continue</button>
        </form>
    </body>
</html>
