<!DOCTYPE html>
<html>
    <head>
        <title>test</title>

        <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" integrity="sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+" crossorigin="anonymous"></script>
        <script>
          let uuid = localStorage.getItem("uuid");
          let currentRoom = null;
          const socket = io(
            "ws://127.0.0.1:5000",
            {
              auth: {
                uuid: uuid
              }
            }
          );

          socket.on("connect", ()=>{
            console.log("Socket ID: ", socket.id);
            document.getElementById("status").innerText = "connected";
            document.getElementById("session").innerText = socket.id;
            socket.emit("get_students");
          });

          socket.on("disconnect", ()=>{
            console.log("Socket ID: ", socket.id);
            document.getElementById("status").innerText = "disconnected";
          });

          socket.on("session", (data)=>{
            console.log("UUID: ", data.uuid);
            document.getElementById("uuid").innerText = data.uuid;
            if (!uuid){
                uuid = data.uuid;
                localStorage.setItem("uuid", uuid);
            }
          });

          socket.on("list", (data)=>{
            console.log("List Called: ", data);
            document.getElementById("students").innerHTML = "";
            for(let i=0; i<data.students; i++){
              const li = document.createElement("li");
              li.innerText = "User" + i;
              document.getElementById("students").appendChild(li);
            }
          });

          socket.on("students_list", (data)=>{
            const studentsList = document.getElementById("all-students");
            studentsList.innerHTML = "";
            data.students.forEach(user => {
              const div = document.createElement("div");
              div.innerHTML = `
                <input type="checkbox" id="user-${user.id}" value="${user.id}">
                <label for="user-${user.id}">User ${user.id.substring(0,8)} ${user.room ? `(Room: ${user.room})` : '(Lobby)'}</label>
              `;
              studentsList.appendChild(div);
            });
          });

          socket.on("room_assigned", (data)=>{
            currentRoom = data.room;
            document.getElementById("room").innerText = data.room;
            updateRoomButtons();
          });

          socket.on("room_left", (data)=>{
            currentRoom = null;
            document.getElementById("room").innerText = "None";
            updateRoomButtons();
          });

          function reset_uuid() {
            uuid = null;
            localStorage.removeItem("uuid");
            location.reload();
          }

          function assignToRoom() {
            const checkboxes = document.querySelectorAll('#all-students input[type="checkbox"]:checked');
            const selectedstudents = Array.from(checkboxes).map(cb => cb.value);

            if (selectedstudents.length > 0) {
              socket.emit("assign_room", {students: selectedstudents});
            }
          }

          function leaveRoom() {
            socket.emit("leave_room");
          }

          function refreshstudents() {
            socket.emit("get_students");
          }

          function updateRoomButtons() {
            const leaveBtn = document.getElementById("leave-room-btn");
            if (currentRoom) {
              leaveBtn.style.display = "inline-block";
            } else {
              leaveBtn.style.display = "none";
            }
          }
        </script>
    </head>
    <body>
        <h1 style="color:red">TEACHER MODE</h1>
        <h3>Status: <span id="status">disconnected</span></h3>
        <p>User ID: <span id="uuid"></span></p>
        <p>Session ID: <span id="session"></span> </p>
        <p>Current Room: <span id="room">None</span></p>

        <div style="display: flex; gap: 20px;">
          <div style="flex: 1;">
            <h3>Students (all rooms)</h3>
            <div id="all-students"></div>

          </div>

          <div style="flex: 1;">
            <h3>Students in Current Room</h3>
            <ul id="students"></ul>
          </div>
        </div>

        <button onclick="assignToRoom()" style="margin-top: 10px;">Assign to a room</button>
        <button onclick="reset_uuid()">Reset UUID</button>
        <button onclick="window.location.href='/'">Become Student</button>
        <button onclick="refreshstudents()">Refresh students</button>
        <button id="leave-room-btn" onclick="leaveRoom()" style="display: none;">Leave Room</button>
    </body>
</html>
