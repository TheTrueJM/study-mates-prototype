<!DOCTYPE html>
<html>
    <head>
        <title>test</title>

        <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" integrity="sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+" crossorigin="anonymous"></script>
        <script>
          let uuid = localStorage.getItem("uuid");
          let current_room = localStorage.getItem("current_room");
          const socket = io(
            "ws://127.0.0.1:5000",
            {
              auth: {
                uuid: uuid,
                room: current_room,
                role: "teacher"
              }
            }
          );

          socket.on("connect", ()=>{
            console.log("Socket ID: ", socket.id);
            document.getElementById("status").innerText = "connected";
            document.getElementById("session").innerText = socket.id;
            socket.emit("get_students");
          });

          socket.on("disconnect", ()=>{
            console.log("Socket ID: ", socket.id);
            document.getElementById("status").innerText = "disconnected";
          });

          socket.on("session", (data)=>{
            console.log("UUID: ", data.uuid);
            console.log("Room: ", data.room);
            document.getElementById("uuid").innerText = data.uuid;
            document.getElementById("room").innerText = data.room;
            if (!uuid){
                uuid = data.uuid;
                localStorage.setItem("uuid", uuid);
            }
            if (!current_room){
                current_room = data.room;
                localStorage.setItem("room", current_room);
            }
          });

          // declare: function written by GLM-4.6
          socket.on("room_list", (data) => {
            const roomsContainer = document.getElementById("rooms");
            roomsContainer.innerHTML = "";

            for (const roomName in data) {
              const roomData = data[roomName];
              const li = document.createElement("li");

              const nameSpan = document.createElement("span");
              nameSpan.className = "room-name";
              nameSpan.innerText = roomName;
              li.appendChild(nameSpan);

              const joinBtn = document.createElement("button");
              joinBtn.innerText = "Join";
              joinBtn.setAttribute("onclick", "joinRoom(this)");
              li.appendChild(joinBtn);

              const moveBtn = document.createElement("button");
              moveBtn.innerText = "Move student(s)";
              moveBtn.setAttribute("onclick", "assignToRoom(this)");
              li.appendChild(moveBtn);

              const ul = document.createElement("ul");

              if (roomData.subrooms) {
                for (const subName in roomData.subrooms) {
                  const subLi = document.createElement("li");
                  const subSpan = document.createElement("span");
                  subSpan.className = "room-name";
                  subSpan.innerText = subName;
                  subLi.appendChild(subSpan);

                  const subJoinBtn = document.createElement("button");
                  subJoinBtn.innerText = "Join";
                  subJoinBtn.setAttribute("onclick", "joinRoom(this, true)");
                  subLi.appendChild(subJoinBtn);

                  const subMoveBtn = document.createElement("button");
                  subMoveBtn.innerText = "Move student(s)";
                  subMoveBtn.setAttribute("onclick", "assignToRoom(this, true)");
                  subLi.appendChild(subMoveBtn);

                  ul.appendChild(subLi);
                }
              }

              const createLi = document.createElement("li");
              const input = document.createElement("input");
              input.type = "text";
              input.placeholder = "New subroom name";
              createLi.appendChild(input);

              const createBtn = document.createElement("button");
              createBtn.innerText = "Create";
              createBtn.setAttribute("onclick", "createSubroom(this)");
              createLi.appendChild(createBtn);

              ul.appendChild(createLi);
              li.appendChild(ul);
              roomsContainer.appendChild(li);
            }
          });

          socket.on("students_list", (data)=>{
            const studentsList = document.getElementById("all-students");
            studentsList.innerHTML = "";
            if (data.students) {
                data.students.forEach(user => {
                    const isTeacher = user.role === "teacher";
                    const label = `${user.id.substring(0,8)} ${user.room ? `(Room: ${user.room})` : '(Lobby)'} ${isTeacher ? '<span style="color:red; font-weight:bold;">(TEACHER)</span>' : ''}`;
                    const div = document.createElement("div");
                    div.innerHTML = `
                        ${isTeacher ? '' : `<input type="checkbox" id="user-${user.id}" value="${user.id}">`}
                        <label for="user-${user.id}">${label}</label>
                    `;
                    studentsList.appendChild(div);
                });
            }
          });

          socket.on("room_assigned", (data)=>{
            current_room = data.room;
            localStorage.setItem("current_room", current_room);
            location.reload();
          });

          socket.on("room_left", (data)=>{
            current_room = null;
            localStorage.removeItem("current_room");
            location.reload();
          });

          function reset_uuid() {
            uuid = null;
            localStorage.removeItem("uuid");
            location.reload();
          }

          function assignToRoom(button, is_subroom=false) { // student
            const room_id = button.parentElement.querySelector(".room-name").textContent;
            const checkboxes = document.querySelectorAll('#all-students input[type="checkbox"]:checked');
            const selectedstudents = Array.from(checkboxes).map(cb => cb.value);

            if (selectedstudents.length > 0) {
              socket.emit("assign_room",
                {
                  students: selectedstudents,
                  room_name: room_id,
                  is_subroom: is_subroom
                }
              );
            }
          }

          function joinRoom(button, is_subroom=false) { // teacher
            const room_id = button.parentElement.querySelector(".room-name").textContent;
            socket.emit("assign_room", room_id,
              {
                students: [uuid],
                room_name: room_id,
                is_subroom: is_subroom
              }
            );
          }

          function createRoom(room_name=null, parent=null) {
            if (!room_name){
              const room_name = document.getElementById("room-name-input").value;
            }
            socket.emit("create_room", {
                "name": room_name,
                "parent": parent
              }
            );
          }

          function createSubroom(button) {
            const input = button.previousElementSibling;
            const room_name = input.value;
            const parent = button.parentElement.querySelector(".room-name").textContent;
            createRoom(room_name, parent);
          }

          function leaveRoom() {
            socket.emit("leave_room");
          }

          function refreshstudents() {
            socket.emit("get_students");
          }
        </script>
    </head>
    <body>
        <h1 style="color:red">TEACHER MODE</h1>
        <h3>Status: <span id="status">disconnected</span></h3>
        <p>User ID: <span id="uuid"></span></p>
        <p>Session ID: <span id="session"></span> </p>
        <p>Current Room: <span id="room">None</span></p>

        <div style="display: flex; gap: 20px;">
          <div style="flex: 1;">
            <h3>Students (Current Room)</h3>
            <div id="all-students"></div>

          </div>

          <div style="flex: 1;">
            <h3>Rooms</h3>
            <span style="font-weight: bold;">Create Parent Room</span>
            <input type="text" id="room-name-input" placeholder="Room Name">
            <button onclick="createRoom()">Create</button>
            <ul id="rooms">
              <li>
                <span class="room-name">Room-1</span>
                <button onclick="joinRoom(this)">Join</button>
                <button onclick="assignToRoom(this)">Move student(s)</button>
                <ul>
                  <li>
                    <input type="text" placeholder="New subroom name" />
                    <button onclick="createSubroom(this)">Create</button>
                  </li>
                </ul>
              </li>
              <li>
                <span class="room-name">Room-2</span>
                <button onclick="joinRoom(this)">Join</button>
                <button onclick="assignToRoom(this)">Move student(s)</button>
                <ul>
                  <li>
                    <span class="room-name">Room-2.1</span>
                    <button onclick="joinRoom(this, true)">Join</button>
                    <button onclick="assignToRoom(this, true)">Move student(s)</button>
                  </li>
                  <li>
                    <span class="room-name">Room-2.2</span>
                    <button onclick="joinRoom(this, true)">Join</button>
                    <button onclick="assignToRoom(this, true)">Move student(s)</button>
                  </li>
                  <li>
                    <input type="text" placeholder="New subroom name" />
                    <button onclick="createSubroom(this)">Create</button>
                  </li>
                </ul>
              </li>
            </ul>
          </div>
        </div>

        <button onclick="reset_uuid()">Reset UUID</button>
        <button onclick="window.location.href='/'">Become Student</button>
        <button onclick="refreshstudents()">Refresh students</button>
        <button id="leave-room-btn" onclick="leaveRoom()" style="display: none;">Leave Room</button>
    </body>
</html>
