[tool.pytest.ini_options]
pythonpath = [ "." ]
addopts = [
    "--disable-warnings",
    "--pdbcls=pudb.debugger:Debugger",
    "-s"
]
log_file = "tests/pytest.log"
log_file_level = "INFO"
log_file_format = "%(asctime)s [%(levelname)s] %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"

[project]
name = "study-mates-prototype-backend"
version = "0.1.2"
dependencies = [
    "eventlet>=0.40.4",
    "flask>=3.1.2",
    "flask_cors>=6.0.5",
    "flask-bcrypt>=1.0.1",
    "flask-jwt-extended>=4.7.4",
    "flask-socketio>=5.6.0",
    "flask-sqlalchemy>=3.1.1",
    "numpy>=2.4.2",
    "pudb>=2025.1.5",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.46",
]
requires-python = "==3.13.5"